name: Update Edge App
description: Builds and deploys an existing Screenly Edge App.

inputs:
  screenly_api_token:
    description: Screenly API token (secrets.SCREENLY_API_TOKEN)
    required: true
  environment:
    description: Target environment (stage or production)
    required: false
    default: stage
  delete_missing_settings:
    description: Delete settings that exist on the server but not in the manifest (true or false)
    required: false
    default: 'false'
  edge_app_id:
    description: >
      Edge App ID for this environment (vars.STAGE_EDGE_APP_ID or
      vars.PRODUCTION_EDGE_APP_ID). Required for update. Placeholders from
      bad Expressions (false, true, null, 0) are rejected.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Check inputs and detect build system
      id: detect
      shell: bash
      env:
        EDGE_APP_ID_INPUT: ${{ inputs.edge_app_id }}
        SCREENLY_API_TOKEN_INPUT: ${{ inputs.screenly_api_token }}
        ENVIRONMENT_INPUT: ${{ inputs.environment }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/prepare.sh" update

    - name: Verify Screenly API token
      shell: bash
      env:
        SCREENLY_API_TOKEN_INPUT: ${{ inputs.screenly_api_token }}
        ENVIRONMENT_INPUT: ${{ inputs.environment }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/verify-token.sh"

    - name: Set up Bun
      if: steps.detect.outputs.has_build_step == 'true'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

    - name: Install dependencies
      if: steps.detect.outputs.has_build_step == 'true'
      shell: bash
      run: bun install --frozen-lockfile

    - name: Build
      if: steps.detect.outputs.has_build_step == 'true'
      shell: bash
      run: bun run build

    - name: Deploy Edge App
      uses: screenly/cli@v26.9.0
      with:
        screenly_api_token: ${{ inputs.screenly_api_token }}
        cli_version: v26.9.0
        cli_commands: edge-app deploy${{ steps.detect.outputs.has_build_step == 'true' && ' --path="./dist"' || '' }} --delete-missing-settings=${{ inputs.delete_missing_settings }}

    - name: Log manifest file
      shell: bash
      run: cat $MANIFEST_FILE_NAME
