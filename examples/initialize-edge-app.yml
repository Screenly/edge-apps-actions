---
name: Initialize Edge App

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment for initialization
        required: true
        default: stage
        type: choice
        options:
          - stage
          - production
      edge_app_name:
        description: Edge App name (used for the CLI --name flag)
        required: true
        type: string
      edge_app_title:
        description: Display title for the Edge App instance
        required: true
        type: string

permissions:
  contents: read

run-name: Initializing ${{ inputs.edge_app_name }} in ${{ inputs.environment }}

jobs:
  initialize:
    # First create: leave STAGE_EDGE_APP_ID / PRODUCTION_EDGE_APP_ID unset.
    # After create: set the matching var to the id in the job summary.
    uses: Screenly/edge-apps-actions/.github/workflows/initialize.yml@v26.10.2
    with:
      environment: ${{ inputs.environment }}
      edge_app_name: ${{ inputs.edge_app_name }}
      edge_app_title: ${{ inputs.edge_app_title }}
    secrets: inherit
