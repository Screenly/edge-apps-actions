---
name: Update Edge App

on:
  workflow_dispatch:
  push:
    # Both are listed so the file works unchanged in main- and master-based
    # repos; the reusable workflow only deploys stage for the default branch.
    branches:
      - main
      - master
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

run-name: Updating Edge App in ${{ (github.event_name == 'push' && !github.event.deleted && startsWith(github.ref, 'refs/tags/v')) && 'production' || 'stage' }}

jobs:
  update:
    # Stage on the default branch, production on v* tags. Concurrency, the
    # default-branch checks and permissions live in the reusable workflow.
    uses: Screenly/edge-apps-actions/.github/workflows/update.yml@v26.10.2
    secrets: inherit
