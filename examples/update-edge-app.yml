---
name: Update Edge App

on:
  workflow_dispatch:
  push:
    # Both are listed so the file works unchanged in main- and master-based
    # repos; the stage job only runs for the repo's default branch.
    branches:
      - main
      - master
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

run-name: Updating Edge App in ${{ (github.event_name == 'push' && !github.event.deleted && startsWith(github.ref, 'refs/tags/v')) && 'production' || 'stage' }}

jobs:
  deploy-stage:
    name: Updating Edge App in stage
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) || github.event_name == 'workflow_dispatch'
    environment: stage
    # One deploy per environment at a time, so an older run can't finish last
    # and overwrite a newer one. Shared with the initialize example.
    concurrency:
      group: edge-app-stage
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: Screenly/edge-apps-actions/update@v26.10.0
        with:
          screenly_api_token: ${{ secrets.SCREENLY_API_TOKEN }}
          environment: stage
          delete_missing_settings: 'true'
          edge_app_id: ${{ vars.STAGE_EDGE_APP_ID }}

  deploy-production:
    name: Updating Edge App in production
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && !github.event.deleted && startsWith(github.ref, 'refs/tags/v')
    environment: production
    concurrency:
      group: edge-app-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify tag is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "Tag $GITHUB_REF_NAME is not on $DEFAULT_BRANCH; refusing to deploy to production."
            exit 1
          fi
      - uses: Screenly/edge-apps-actions/update@v26.10.0
        with:
          screenly_api_token: ${{ secrets.SCREENLY_API_TOKEN }}
          environment: production
          delete_missing_settings: 'true'
          edge_app_id: ${{ vars.PRODUCTION_EDGE_APP_ID }}
