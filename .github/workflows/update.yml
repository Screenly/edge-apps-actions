---
name: Update Edge App

on:
  workflow_call:
    inputs:
      delete_missing_settings:
        description: >
          Delete settings that exist on the server but not in the manifest.
          Defaults to true here, as the app callers always passed, so the
          manifest stays the source of truth; the update action itself
          defaults to false for direct use.
        type: boolean
        required: false
        default: true
    secrets:
      SCREENLY_API_TOKEN:
        description: Screenly API token (the caller's secrets.SCREENLY_API_TOKEN)
        required: true

permissions:
  contents: read

jobs:
  deploy-stage:
    name: Deploy to stage
    runs-on: ubuntu-latest
    # Only pushes and manual runs deploy stage, and only from the default
    # branch; any other trigger a caller adds (e.g. schedule) is ignored.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: stage
    # Never cancel a running deploy: one stopped between publish and promotion leaves the old revision live.
    concurrency:
      group: edge-app-stage
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Screenly/edge-apps-actions/update@v26.10.2
        with:
          screenly_api_token: ${{ secrets.SCREENLY_API_TOKEN }}
          environment: stage
          delete_missing_settings: ${{ inputs.delete_missing_settings }}
          edge_app_id: ${{ vars.STAGE_EDGE_APP_ID }}

  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && !github.event.deleted && startsWith(github.ref, 'refs/tags/v')
    environment: production
    concurrency:
      group: edge-app-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Only catches mistakes; the tag ruleset and reviewers enforce it (README, "Protect production").
      - name: Verify tag is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "Tag $GITHUB_REF_NAME is not on $DEFAULT_BRANCH; refusing to deploy to production."
            exit 1
          fi
      - uses: Screenly/edge-apps-actions/update@v26.10.2
        with:
          screenly_api_token: ${{ secrets.SCREENLY_API_TOKEN }}
          environment: production
          delete_missing_settings: ${{ inputs.delete_missing_settings }}
          edge_app_id: ${{ vars.PRODUCTION_EDGE_APP_ID }}
