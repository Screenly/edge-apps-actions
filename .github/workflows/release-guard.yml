---
name: Release guard

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  pins:
    name: Version pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: python3 scripts/check_pins.py
