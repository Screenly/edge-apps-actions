name: Initialize Edge App
description: Creates and deploys a new Screenly Edge App instance.

inputs:
  screenly_api_token:
    description: Screenly API token
    required: true
  edge_app_name:
    description: Edge App name (used for the CLI --name flag)
    required: true
  edge_app_title:
    description: Display title for the Edge App instance
    required: true
  environment:
    description: Target environment (stage or production)
    required: false
    default: stage
  edge_app_id:
    description: >
      Edge App ID for this environment. When provided, it's exported as
      EDGE_APP_ID and takes precedence over any id in screenly.yml/screenly_qc.yml;
      the manifest file is not branched by environment in that case. When
      omitted, behavior is unchanged from before this input existed.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Detect build system
      id: detect
      shell: bash
      env:
        EDGE_APP_ID_INPUT: ${{ inputs.edge_app_id }}
      run: |
        HAS_BUILD_STEP=false

        if [ -f "package.json" ]; then
          SCREENLY_DEP=$(jq -r '((.dependencies // {}) + (.devDependencies // {}))["@screenly/edge-apps"] // empty' package.json)
          if [ -n "$SCREENLY_DEP" ]; then
            HAS_BUILD_STEP=true
          fi
        fi

        echo "has_build_step=$HAS_BUILD_STEP" >> "$GITHUB_OUTPUT"

        if [ -n "$EDGE_APP_ID_INPUT" ]; then
          delimiter="$(openssl rand -hex 8)"
          echo "EDGE_APP_ID<<${delimiter}" >> "$GITHUB_ENV"
          echo "$EDGE_APP_ID_INPUT" >> "$GITHUB_ENV"
          echo "${delimiter}" >> "$GITHUB_ENV"
          echo "MANIFEST_FILE_NAME=screenly.yml" >> "$GITHUB_ENV"
        elif [ "${{ inputs.environment }}" = "stage" ]; then
          echo "MANIFEST_FILE_NAME=screenly_qc.yml" >> "$GITHUB_ENV"
        else
          echo "MANIFEST_FILE_NAME=screenly.yml" >> "$GITHUB_ENV"
        fi

        if [ "${{ inputs.environment }}" = "stage" ]; then
          echo "API_BASE_URL=https://api.screenlyappstage.com" >> "$GITHUB_ENV"
        else
          echo "API_BASE_URL=https://api.screenlyapp.com" >> "$GITHUB_ENV"
        fi

    - name: Set up Bun
      if: steps.detect.outputs.has_build_step == 'true'
      uses: oven-sh/setup-bun@v2

    - name: Install dependencies
      if: steps.detect.outputs.has_build_step == 'true'
      shell: bash
      run: bun install --frozen-lockfile

    - name: Create Edge App
      uses: screenly/cli@v26.9.0
      with:
        screenly_api_token: ${{ inputs.screenly_api_token }}
        cli_version: v26.9.0
        cli_commands: edge-app create --name="${{ inputs.edge_app_name }}" --in-place

    - name: Build
      if: steps.detect.outputs.has_build_step == 'true'
      shell: bash
      run: bun run build

    - name: Deploy Edge App
      uses: screenly/cli@v26.9.0
      with:
        screenly_api_token: ${{ inputs.screenly_api_token }}
        cli_version: v26.9.0
        cli_commands: edge-app deploy${{ steps.detect.outputs.has_build_step == 'true' && ' --path="./dist"' || '' }}

    - name: Log manifest file
      shell: bash
      run: cat $MANIFEST_FILE_NAME

    - name: Create Instance
      uses: screenly/cli@v26.9.0
      with:
        screenly_api_token: ${{ inputs.screenly_api_token }}
        cli_version: v26.9.0
        cli_commands: edge-app instance create --name="${{ inputs.edge_app_title }}"

    - name: Update Instance
      uses: screenly/cli@v26.9.0
      with:
        screenly_api_token: ${{ inputs.screenly_api_token }}
        cli_version: v26.9.0
        cli_commands: edge-app instance update

    - name: Log instance.yml
      shell: bash
      run: cat instance.yml
