name: Initialize Edge App
description: Creates and deploys a new Screenly Edge App instance.

inputs:
  screenly_api_token:
    description: Screenly API token (secrets.SCREENLY_API_TOKEN)
    required: true
  edge_app_name:
    description: Edge App name (used for the CLI --name flag)
    required: true
  edge_app_title:
    description: Display title for the Edge App instance
    required: true
  environment:
    description: Target environment (stage or production)
    required: false
    default: stage
  edge_app_id:
    description: >
      Edge App ID for this environment (vars.STAGE_EDGE_APP_ID or
      vars.PRODUCTION_EDGE_APP_ID). Pass it so the action can refuse to run
      when the environment is already initialized; it is empty on first
      create. Placeholders from bad Expressions (false, true, null, 0) count
      as empty.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Detect build system
      id: detect
      shell: bash
      env:
        EDGE_APP_ID_INPUT: ${{ inputs.edge_app_id }}
        SCREENLY_API_TOKEN_INPUT: ${{ inputs.screenly_api_token }}
        ENVIRONMENT_INPUT: ${{ inputs.environment }}
        EDGE_APP_NAME_INPUT: ${{ inputs.edge_app_name }}
        EDGE_APP_TITLE_INPUT: ${{ inputs.edge_app_title }}
      run: |
        set -euo pipefail

        if [ -z "${SCREENLY_API_TOKEN_INPUT}" ]; then
          echo "::error::screenly_api_token is empty. Add GitHub secret SCREENLY_API_TOKEN for this environment (stage and production both need a token)."
          exit 1
        fi

        # The name and title end up inside a double-quoted shell command run by
        # screenly/cli, so reject characters that would break out of the quotes.
        check_cli_arg() {
          if [ -z "$2" ]; then
            echo "::error::$1 is empty."
            exit 1
          fi
          case "$2" in
            *[\"\$\`\\]*)
              echo "::error::$1 must not contain \", \$, \` or \\."
              exit 1
              ;;
          esac
          if [[ "$2" =~ [[:cntrl:]] ]]; then
            echo "::error::$1 must not contain control characters (e.g. newlines)."
            exit 1
          fi
        }
        check_cli_arg edge_app_name "${EDGE_APP_NAME_INPUT}"
        check_cli_arg edge_app_title "${EDGE_APP_TITLE_INPUT}"

        case "${ENVIRONMENT_INPUT}" in
          stage)
            echo "API_BASE_URL=https://api.screenlyappstage.com" >> "$GITHUB_ENV"
            ;;
          production)
            echo "API_BASE_URL=https://api.screenlyapp.com" >> "$GITHUB_ENV"
            ;;
          *)
            echo "::error::environment must be 'stage' or 'production' (got '${ENVIRONMENT_INPUT}')."
            exit 1
            ;;
        esac

        # Apps with a build script are built and deployed from ./dist.
        HAS_BUILD_STEP=false
        if [ -f "package.json" ]; then
          BUILD_SCRIPT=$(jq -r '.scripts.build // empty' package.json)
          if [ -n "$BUILD_SCRIPT" ]; then
            HAS_BUILD_STEP=true
          fi
        fi
        echo "has_build_step=$HAS_BUILD_STEP" >> "$GITHUB_OUTPUT"

        # Apps without a build step are deployed from the repo root, and the
        # CLI uploads every file there, hidden folders included. Keep git
        # internals, workflows and dependencies out of the deployed app.
        if [ "$HAS_BUILD_STEP" = false ]; then
          if [ -s .ignore ] && [ -n "$(tail -c 1 .ignore)" ]; then
            echo >> .ignore
          fi
          for pattern in .git/ .github/ .claude/ node_modules/; do
            grep -qxF "$pattern" .ignore 2>/dev/null || echo "$pattern" >> .ignore
          done
        fi
        echo "MANIFEST_FILE_NAME=screenly.yml" >> "$GITHUB_ENV"

        # Trim whitespace; ignore Expression leftovers / placeholders.
        EDGE_APP_ID_TRIMMED=$(printf '%s' "${EDGE_APP_ID_INPUT}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
        EDGE_APP_ID_LC=$(printf '%s' "${EDGE_APP_ID_TRIMMED}" | tr '[:upper:]' '[:lower:]')
        case "${EDGE_APP_ID_LC}" in
          ''|false|true|null|none|0|undefined)
            echo "edge_app_id is empty — first-time create (no EDGE_APP_ID export)."
            ;;
          *)
            # Re-running initialize would create a second instance (and, if the
            # var were later cleared, a second app). Deploys belong to update.
            echo "::error::This environment is already initialized (edge_app_id is ${EDGE_APP_ID_TRIMMED}). Use the update action to deploy. To start over, delete the Edge App in Screenly and clear the ${ENVIRONMENT_INPUT} id variable first."
            exit 1
            ;;
        esac

    - name: Verify Screenly API token
      shell: bash
      env:
        SCREENLY_API_TOKEN_INPUT: ${{ inputs.screenly_api_token }}
        ENVIRONMENT_INPUT: ${{ inputs.environment }}
      run: |
        set -euo pipefail
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
          --connect-timeout 10 \
          --max-time 30 \
          --retry 3 \
          --retry-delay 2 \
          -H "Authorization: Token ${SCREENLY_API_TOKEN_INPUT}" \
          "$API_BASE_URL/api/v4.1/users/")
        echo "Auth check status: $STATUS"
        if [ "$STATUS" != "200" ]; then
          echo "::error::SCREENLY_API_TOKEN validation failed for ${ENVIRONMENT_INPUT} (HTTP $STATUS). Check the secret for this environment."
          exit 1
        fi
        echo "Token is valid"

    # A second Initialize run (e.g. dispatched twice) waits in the concurrency
    # queue and would otherwise create a duplicate app, because the id variable
    # isn't set yet. Refuse when an app with this name already exists. Fail-open:
    # if the lookup itself fails, warn and continue rather than block.
    - name: Check for an existing Edge App with this name
      shell: bash
      env:
        SCREENLY_API_TOKEN_INPUT: ${{ inputs.screenly_api_token }}
        ENVIRONMENT_INPUT: ${{ inputs.environment }}
        EDGE_APP_NAME_INPUT: ${{ inputs.edge_app_name }}
      run: |
        set -uo pipefail
        BODY=$(mktemp)
        STATUS=$(curl -s -o "$BODY" -w "%{http_code}" \
          --connect-timeout 10 \
          --max-time 30 \
          --retry 3 \
          --retry-delay 2 \
          -H "Authorization: Token ${SCREENLY_API_TOKEN_INPUT}" \
          "$API_BASE_URL/v4/edge-apps?select=id,name&deleted=eq.false")
        if [ "$STATUS" != "200" ] || ! EXISTING=$(jq -r --arg name "$EDGE_APP_NAME_INPUT" '[.[] | select(.name == $name) | .id] | join(", ")' "$BODY" 2>/dev/null); then
          echo "::warning::Could not list existing Edge Apps (HTTP $STATUS); skipping the duplicate-name check."
          exit 0
        fi
        if [ -n "$EXISTING" ]; then
          echo "::error::An Edge App named '${EDGE_APP_NAME_INPUT}' already exists in ${ENVIRONMENT_INPUT} (id: ${EXISTING}). If it belongs to this repo, set the ${ENVIRONMENT_INPUT} id variable to that id instead of initializing again; otherwise choose a different name."
          exit 1
        fi
        echo "No existing Edge App named '${EDGE_APP_NAME_INPUT}' in ${ENVIRONMENT_INPUT}."

    - name: Set up Bun
      if: steps.detect.outputs.has_build_step == 'true'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

    - name: Install dependencies
      if: steps.detect.outputs.has_build_step == 'true'
      shell: bash
      run: bun install --frozen-lockfile

    - name: Create Edge App
      uses: screenly/cli@v26.9.0
      with:
        screenly_api_token: ${{ inputs.screenly_api_token }}
        cli_version: v26.9.0
        cli_commands: edge-app create --name="${{ inputs.edge_app_name }}" --in-place

    # Print the id as soon as the app exists, so it isn't lost if a later
    # step fails (the workspace, and the id in screenly.yml, are discarded).
    - name: Report Edge App id
      shell: bash
      env:
        ENVIRONMENT_INPUT: ${{ inputs.environment }}
      run: |
        set -euo pipefail
        ID="$(grep -E '^id:[[:space:]]*' "$MANIFEST_FILE_NAME" | head -1 | awk '{print $2}' | tr -d "\"'" || true)"
        if [ -z "$ID" ]; then
          echo "::error::No id found in $MANIFEST_FILE_NAME after create."
          exit 1
        fi
        if [ "$ENVIRONMENT_INPUT" = production ]; then
          VAR_NAME=PRODUCTION_EDGE_APP_ID
        else
          VAR_NAME=STAGE_EDGE_APP_ID
        fi
        echo "::notice::Created Edge App id $ID. Once this run has finished successfully, set repo variable $VAR_NAME to this value."
        {
          echo "## Edge App id"
          echo ""
          echo "Created Edge App id: \`$ID\`"
          echo ""
          echo "Once this run has finished successfully, set repository variable \`$VAR_NAME\` to this value (Settings → Secrets and variables → Actions → Variables). Setting it earlier lets a deploy start while this run is still building and creating the instance."
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Build
      if: steps.detect.outputs.has_build_step == 'true'
      shell: bash
      run: bun run build

    - name: Deploy Edge App
      uses: screenly/cli@v26.9.0
      with:
        screenly_api_token: ${{ inputs.screenly_api_token }}
        cli_version: v26.9.0
        cli_commands: edge-app deploy${{ steps.detect.outputs.has_build_step == 'true' && ' --path="./dist"' || '' }}

    - name: Log manifest file
      shell: bash
      run: cat $MANIFEST_FILE_NAME

    - name: Create Instance
      uses: screenly/cli@v26.9.0
      with:
        screenly_api_token: ${{ inputs.screenly_api_token }}
        cli_version: v26.9.0
        cli_commands: edge-app instance create --name="${{ inputs.edge_app_title }}"

    - name: Update Instance
      uses: screenly/cli@v26.9.0
      with:
        screenly_api_token: ${{ inputs.screenly_api_token }}
        cli_version: v26.9.0
        cli_commands: edge-app instance update

    - name: Log instance.yml
      shell: bash
      run: |
        cat instance.yml
        echo ""
        echo "Set repo variable STAGE_EDGE_APP_ID or PRODUCTION_EDGE_APP_ID for this environment"
        echo "to the Edge App id shown in the job summary."
